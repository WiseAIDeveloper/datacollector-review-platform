<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Genuine image collection</title>
    <link rel="stylesheet" href="/terminal.css" />
    <link rel="stylesheet" href="/genuine_gallery.css" />
    <script src="/project_context.js"></script>
    <script src="/genuine_gallery.js" defer></script>
  </head>
  <body class="terminal genuine-gallery">
    <nav class="app-sidebar" aria-label="Main navigation">
      <strong>Capture workspace</strong>
      <a href="/genuine.html" aria-current="page">Dashboard</a>
      <a href="/coverage.html">Coverage detail</a>
      <a href="/">Capture review</a>
      <a href="/quality.html">Quality review</a>
      <a href="/ingestion.html">Ingestion logs</a>
      <a href="/search.html">Image search</a>
    </nav>
    <header class="frozen-pane workspace-header">
      <div class="header-titlebar">
        <h1>Genuine image collection</h1>
        <div class="header-actions">
          <button id="refresh">Refresh now</button>
        </div>
      </div>
    </header>
    <main>
      <noscript
        >This gallery needs JavaScript. Open it in a browser through the running
        preview.</noscript
      >
      <section class="gallery-choices" aria-label="Collection setup">
        <div>
          <h2>Batch</h2>
          <div
            id="batch-choices"
            class="choice-buttons"
            role="group"
            aria-label="Batch"
          ></div>
        </div>
        <div>
          <h2>Phone + lighting</h2>
          <div
            id="combination-choices"
            class="choice-buttons"
            role="group"
            aria-label="Phone and lighting"
          ></div>
        </div>
      </section>
      <div class="gallery-tools">
        <label for="number-search"
          >Find a number
          <input
            id="number-search"
            type="search"
            inputmode="numeric"
            autocomplete="off"
            placeholder="1–50"
          />
        </label>
        <div class="density-control">
          <label for="density"
            >Images per row:
            <output id="density-value" for="density">4</output></label
          >
          <input
            id="density"
            type="range"
            min="0"
            max="2"
            step="1"
            value="1"
            list="density-steps"
          />
          <datalist id="density-steps">
            <option value="0" label="2"></option>
            <option value="1" label="4"></option>
            <option value="2" label="8"></option>
          </datalist>
          <div class="density-labels" aria-hidden="true">
            <span>2</span><span>4</span><span>8</span>
          </div>
        </div>
      </div>
      <p id="gallery-status" role="status" aria-live="polite">
        Loading images… Open this page through the running preview, not as an
        HTML file.
      </p>
      <p id="gallery-error" role="alert"></p>
      <div id="genuine-cards" class="genuine-cards"></div>
    </main>
    <dialog id="zoom" aria-label="Genuine image preview">
      <button id="close-zoom" type="button">Close</button>
      <img alt="" />
    </dialog>
    <link rel="stylesheet" href="/frozen_panes.css" />
    <script src="/image_zoom.js" defer></script>
  </body>
</html>
